    <h1>องค์ประกอบภายใน FastAPI ของ LabClear 4.0.0-rc2</h1>

<title id="architecture-4.0-detail-title">องค์ประกอบภายใน FastAPI ของ LabClear 4.0.0-rc2</title>
<desc id="architecture-4.0-detail-desc">แผนภาพองค์ประกอบภายในบริการ API labclear (FastAPI ของ Codex) รุ่น 4.0.0-rc2: routers ได้แก่ business, chats, business_ops, ai_admin, samples, site (หน้า Jinja), organization_sources, google_auth และ public ที่เพิ่มใหม่แบบอ่านอย่างเดียวพร้อม /membership ทุกคำขอผ่านการตรวจ session, CSRF, origin (Host ของตัวเองหรือ TRUSTED_ORIGINS ที่ตรงตัว) และ rate limit ก่อนถึงตัวอ่านใบผล report_reader_v2 ไปป์ไลน์แชต business_agent และเอกสารองค์กร organization_sources ซึ่งค้นเฉพาะองค์กรของผู้ใช้ ใช้เฉพาะเอกสารที่อนุมัติแล้ว และตรวจการถอนซ้ำทุกครั้ง ไปป์ไลน์แชตทำงานทีละขั้นตามลำดับ เรียก conversation_guard ค้น evidence_search ด้วย BM25 บนฐาน 58 รายการ และใช้ model_harness กับ runtime_skills เฉพาะเมื่อเปิด MEDICAL_HARNESS_ENABLED หรือ RUNTIME_SKILLS_ENABLED ทุกการเรียกโมเดลผ่าน conversation_transport, cost_ledger และ providers (3 slot และ 6 agents) ซึ่งตรวจ PROVIDER_NETWORK_ENABLED เพดาน CLOUD_CALL_LIMIT และบัญชี 300 บาทก่อนถึงผู้ให้บริการ AI ข้อมูลถาวรผ่าน business_store ที่เข้ารหัส Fernet ไปยัง PostgreSQL บน Render หรือ SQLite ในเครื่อง flag ใหม่ 6 ตัวของ Codex ปิดเป็นค่าเริ่มต้น</desc>
