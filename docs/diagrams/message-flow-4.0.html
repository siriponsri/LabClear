<desc id="message-flow-4.0-desc">แผนภาพลำดับของ 1 ข้อความในรุ่นรวม 4.0.0-rc2 มีเส้นชีวิต 4 เส้น ได้แก่ เบราว์เซอร์ บริการเว็บ Render (Next.js) FastAPI (Codex) และผู้ให้บริการ AI ขั้น 01 เบราว์เซอร์ POST /api/business/chat พร้อม Accept: application/x-ndjson ไปที่บริการเว็บ ซึ่ง rewrite ผ่าน HTTPS ไปยัง FastAPI ขั้น 02 ตรวจ session, CSRF, origin และ rate limit แล้วบันทึกข้อความ (บัญชีลง PostgreSQL ผู้เยี่ยมชมลง RAM ชั่วคราว) ขั้น 03 ถ้าเปิดเอกสารองค์กร ตรวจซ้ำว่าแหล่งส่วนตัวในประวัติยังอนุมัติและเป็นขององค์กรเดิม ถ้าไม่ ตัดออกจาก context ขั้น 04 ตรวจความปลอดภัยขาเข้าด้วย regex ก่อนแล้วจึงเรียก safety model ขั้น 05 เรียก planner ขั้น 06 ค้น BM25 บนฐาน 58 รายการ และใช้ข้อความองค์กรที่อนุมัติแล้วเฉพาะเมื่อเปิด ORG_REFERENCE_INFERENCE_ENABLED ขั้น 07 เรียกผู้เขียนคำตอบตามบทบาทให้เขียน JSON พร้อม citation (runtime skills และ medical harness ใช้เฉพาะเมื่อเปิด flag) ขั้น 08 Python ตรวจ citation ค่าผลตรวจ ราคา และบทบาท แล้วเรียก reviewer โดยเขียนใหม่ได้ 1 รอบ จากนั้นเรียก safety model ตรวจคำตอบขาออก ขั้น 09 บันทึกคำตอบ แหล่งอ้างอิง และขั้นตอน แล้วส่ง {&quot;type&quot;:&quot;done&quot;} เป็นบรรทัดสุดท้าย ระหว่างทางทุกขั้นส่งบรรทัด NDJSON กลับไปที่เบราว์เซอร์ผ่านบริการเว็บ ทุกการเรียกโมเดลทำทีละครั้งตามลำดับ และผ่านด่าน PROVIDER_NETWORK_ENABLED เพดาน CLOUD_CALL_LIMIT และบัญชี 300 บาทก่อนเสมอ</desc>
