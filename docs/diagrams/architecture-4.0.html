  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fdfcfe;   /* LabClear paper */
      --color-ink:     #23202b;
      --color-muted:   #6b6875;
      --color-accent:  #6539a9;   /* LabClear purple */
      --font-sans:     'Geist', 'Noto Sans Thai', system-ui, sans-serif;
      --font-serif:    'Source Serif 4', 'Noto Serif Thai', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.5;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
