  <desc id="rs-seq-desc">The browser posts a message to the business API. The API counts the call and checks the budget in PostgreSQL, screens the message with the safety check, asks the language model to plan, searches the knowledge base, drafts an answer, checks prices and policies in Python, has the model review it, screens the answer and saves the chat. If every check passes the answer is shown with sources; otherwise the message is marked failed with a Retry button.</desc>
