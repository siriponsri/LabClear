="680" y="228" width="260" height="96" rx="7" fill="#f1f0f4" stroke="#5e5a66" stroke-width="1.1"/><rect x="690" y="238" width="110.0" height="16" rx="3" fill="#fdfcfe" stroke="#6b6875" stroke-width="0.7"/><text x="745.0" y="250" fill="#6b6875" font-size="9.5" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anchor="middle" letter-spacing="0.08em">CUSTOMER STATE</text><text x="810.0" y="270.0" fill="#23202b" font-size="14" font-weight="600" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">Customer notification</text><text x="810.0" y="290.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">Payment recorded (simulation)</text><text x="810.0" y="306.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">No bank transfer or real settlement</text><rect x="40" y="382" width="920" height="198" rx="10" fill="rgba(35,32,43,0.025)" stroke="rgba(35,32,43,0.14)" stroke-width="0.8"/><rect x="52" y="374" width="258.8" height="16" rx="3" fill="#fdfcfe"/><text x="59" y="386" fill="#6b6875" font-size="10" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anchor="start" letter-spacing="0.12em">SUPPORT HANDOFF · EXPLICIT SHARING</text><rect x="60" y="418" width="200" height="112" rx="7" fill="#ecebf0" stroke="#7d7987" stroke-width="1.1"/><rect x="70" y="428" width="68.0" height="16" rx="3" fill="#fdfcfe" stroke="#6b6875" stroke-width="0.7"/><text x="104.0" y="440" fill="#6b6875" font-size="9.5" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anchor="middle" letter-spacing="0.08em">CUSTOMER</text><text x="160.0" y="468.0" fill="#23202b" font-size="14" font-weight="600" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">Request team help</text><text x="160.0" y="488.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">choose what to share</text><text x="160.0" y="504.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">nothing is shared automatically</text><rect x="280" y="418" width="200" height="112" rx="7" fill="#ffffff" stroke="#23202b" stroke-width="1.1"/><rect x="290" y="428" width="54.0" height="16" rx="3" fill="#fdfcfe" stroke="#6b6875" stroke-width="0.7"/><text x="317.0" y="440" fill="#6b6875" font-size="9.5" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text><text x="380.0" y="468.0" fill="#23202b" font-size="14" font-weight="600" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">Open support request</text><text x="380.0" y="488.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">history stays hidden before takeover</text><text x="380.0" y="504.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">only chosen items are shared</text><rect x="500" y="418" width="200" height="112" rx="7" fill="#ffffff" stroke="#23202b" stroke-width="1.1"/><rect x="510" y="428" width="47.0" height="16" rx="3" fill="#fdfcfe" stroke="#6b6875" stroke-width="0.7"/><text x="533.5" y="440" fill="#6b6875" font-size="9.5" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anchor="middle" letter-spacing="0.08em">STAFF</text><text x="600.0" y="468.0" fill="#23202b" font-size="14" font-weight="600" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">Take over and reply</text><text x="600.0" y="488.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">team member owns the request</text><text x="600.0" y="504.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">reply reaches customer</text><rect x="720" y="418" width="200" height="112" rx="7" fill="#ecebf0" stroke="#7d7987" stroke-width="1.1"/><rect x="730" y="428" width="68.0" height="16" rx="3" fill="#fdfcfe" stroke="#6b6875" stroke-width="0.7"/><text x="764.0" y="440" fill="#6b6875" font-size="9.5" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anchor="middle" letter-spacing="0.08em">CUSTOMER</text><text x="820.0" y="468.0" fill="#23202b" font-size="14" font-weight="600" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">Resume or close</text><text x="820.0" y="488.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">choose whether to return to bot</text><text x="820.0" y="504.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">closed chat stays closed</text><path d="M 260 474 L 278 474" fill="none" stroke="#2f6fb5" stroke-width="1.3" marker-end="url(#a-link)"/><path d="M 480 474 L 498 474" fill="none" stroke="#6b6875" stroke-width="1.3" marker-end="url(#a-muted)"/><path d="M 700 474 L 718 474" fill="none" stroke="#6539a9" stroke-width="1.3" marker-end="url(#a-accent)"/><line x1="40" y1="620" x2="960" y2="620" stroke="rgba(35,32,43,0.14)" stroke-width="0.8"/><rect x="40" y="639" width="18"