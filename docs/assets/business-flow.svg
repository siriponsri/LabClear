-anchor="start">Denied</text><text x="40" y="710" fill="#6b6875" font-size="11" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="start">All package, price, booking, payment and center data in this diagram are synthetic demonstration data.</text></svg>
