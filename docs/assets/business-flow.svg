 Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">does not settle payment</text><rect x="680" y="92" width="260" height="108" rx="7" fill="#faf8fd" stroke="#6539a9" stroke-width="1.1" stroke-dasharray="5 4"/><rect x="690" y="102" width="61.0" height="16" rx="3" fill="#fdfcfe" stroke="#6539a9" stroke-width="0.7"/><text x="720.5" y="114" fill="#6539a9" font-size="9.5" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anchor="middle" letter-spacing="0.08em">MANAGER</text><text x="810.0" y="132.0" fill="#23202b" font-size="14" font-weight="600" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">Record simulated receipt</text><text x="810.0" y="152.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">only after confirmation</text><text x="810.0" y="168.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">record simulated payment</text><text x="810.0" y="184.0" fill="#6b6875" font-size="11.5" font-weight="400" font-family="'Geist','IBM Plex Sans Thai','Segoe UI',system-ui,sans-serif" text-anchor="middle">save activity + customer notice</text><path d="M 320 146 L 368 146" fill="none" stroke="#2f6fb5" stroke-width="1.3" marker-end="url(#a-link)"/><rect x="324" y="124" width="56.199999999999996" height="15" rx="2" fill="#fdfcfe"/><text x="329" y="135" fill="#2f6fb5" font-size="10" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anchor="start" letter-spacing="0.06em">REQUEST</text><path d="M 630 146 L 678 146" fill="none" stroke="#6539a9" stroke-width="1.3" marker-end="url(#a-accent)"/><rect x="635" y="124" width="69.4" height="15" rx="2" fill="#fdfcfe"/><text x="640" y="135" fill="#6539a9" font-size="10" font-weight="500" font-fa