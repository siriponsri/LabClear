<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t d"><title id="t">LabClear 4.0.0-rc3: business workflow</title><desc id="d">Synthetic customer booking and support handoff. Staff and clinical roles may confirm or decline an appointment, but only a manager may record the existing center-payment simulator event. A denied settlement request is 403 with payment, receipt, audit and customer notification state unchanged.</desc><defs><marker id="a-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6b6875"/></marker><marker id="a-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6539a9"/></marker><marker id="a-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2f6fb5"/></marker></defs><rect width="100%" height="100%" fill="#fdfcfe"/><text x="40" y="30" fill="#6b6875" font-size="10.5" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anchor="start" letter-spacing="0.16em">BUSINESS WORKFLOW · LABCLEAR 4.0.0-RC3</text><rect x="40" y="56" width="920" height="294" rx="10" fill="rgba(35,32,43,0.025)" stroke="rgba(35,32,43,0.14)" stroke-width="0.8"/><rect x="52" y="48" width="258.8" height="16" rx="3" fill="#fdfcfe"/><text x="59" y="60" fill="#6b6875" font-size="10" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anchor="start" letter-spacing="0.12em">BOOKING · SIMULATED CENTER PAYMENT</text><rect x="60" y="92" width="260" height="108" rx="7" fill="#ecebf0" stroke="#7d7987" stroke-width="1.1"/><rect x="70" y="102" width="68.0" height="16" rx="3" fill="#fdfcfe" stroke="#6b6875" stroke-width="0.7"/><text x="104.0" y="114" fill="#6b6875" font-size="9.5" font-weight="500" font-family="'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,monospace" text-anch