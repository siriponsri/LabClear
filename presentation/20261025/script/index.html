<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FDFCFE">
<title>LabClear Speaker Script</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/script.css?v=1">
</head>
<body>
<header class="bar">
  <div class="row">
    <div class="who" role="group" aria-label="เน้นบทของ">
      <button type="button" data-who="all" class="on">ทั้งหมด</button>
      <button type="button" data-who="A">A วัชรินทร์</button>
      <button type="button" data-who="B">B ศิริพล</button>
    </div>
    <div class="clock">
      <span class="t" id="t">0:00</span>
      <span class="plan" id="plan">พร้อมเริ่ม</span>
      <button type="button" id="go" aria-label="เริ่ม / หยุดนาฬิกา">เริ่ม</button>
      <button type="button" id="reset" aria-label="รีเซ็ตนาฬิกา">↺</button>
    </div>
    <div class="size" role="group" aria-label="ขนาดตัวอักษร">
      <button type="button" id="smaller" aria-label="ตัวเล็กลง">A−</button>
      <button type="button" id="bigger" aria-label="ตัวใหญ่ขึ้น">A+</button>
    </div>
  </div>
  <nav class="jump" id="jump" aria-label="ไปยัง section"></nav>
</header>
<main id="doc" aria-live="polite"><p class="loading">กำลังโหลดบทพูด…</p></main>

<script src="js/script.js?v=1"></script>
</body>
</html>
