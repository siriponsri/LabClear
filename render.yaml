# Render Blueprint: one Python web service (the FastAPI website, API and admin) at
# https://labclear.onrender.com, deployed automatically on every commit to main.
# See docs/deploy/render.md. Values marked `sync: false` are entered in the Render dashboard and
# never committed. Render matches the service by name; review the plan it shows before Apply.
services:
  - type: web
    name: labclear
    runtime: python
    repo: https://github.com/siriponsri/LabClear
    branch: main
    autoDeployTrigger: commit
    # region is fixed when a service is created. Add `region: <current region>` if the existing
    # service is not in Oregon (Render's default) before syncing this Blueprint.
    plan: free
    buildCommand: pip install -r requirements.txt
    # One Uvicorn process: Guest chats live in process memory. On SIGTERM it drains (see below).
    startCommand: python scripts/run_business.py
    # Readiness, not liveness: started, not draining, storage answering (read-only, < 1 s). It never
    # calls an AI provider or OCR, so a provider outage does not restart the service. /health stays
    # the plain liveness check. See docs/operations/resilience.md.
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: BUSINESS_EXTERNAL_ENABLED
        value: "false"
      # Company Harness: reviewed runtime skills are on; typed tools always run server-side.
      # A manager can tune both on /staff → Company Harness (saved per revision in the database).
      - key: RUNTIME_SKILLS_ENABLED
        value: "true"
      # Official hospital package links (reviewed pages, no booking or partnership).
      - key: HOSPITAL_LINKS_ENABLED
        value: "true"
      # MEDICAL_HARNESS_ENABLED stays off: the analyzer/composer profile needs explicit model setup.
      # Request resilience (docs/operations/resilience.md): per-instance limits for the free plan's single
      # instance. Validated at startup; an invalid value stops the deploy before it takes traffic.
      - key: CHAT_DEADLINE_SECONDS
        value: "220"
      - key: REPORT_DEADLINE_SECONDS
        value: "150"
      - key: STREAM_HEARTBEAT_SECONDS
        value: "10"
      - key: AI_MAX_IN_FLIGHT
        value: "2"
      - key: OCR_MAX_IN_FLIGHT
        value: "1"
      - key: PROVIDER_TRANSPORT_RETRIES
        value: "0"
      - key: SHUTDOWN_DRAIN_SECONDS
        value: "20"
      # Storage
      - key: DATABASE_URL
        sync: false
      - key: BUSINESS_DATA_KEY
        sync: false
      # AI stays off unless PROVIDER_NETWORK_ENABLED is true. Providers and keys can be set
      # here or later by a manager on /staff → AI providers.
      - key: PROVIDER_NETWORK_ENABLED
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GUARD_PROVIDER
        sync: false
      - key: GUARD_API_KEY
        sync: false
      - key: VISION_ENABLED
        sync: false
      - key: VISION_API_KEY
        sync: false
      # Spending limits
      - key: PROVIDER_BUDGET_CYCLE_ID
        sync: false
      - key: CLOUD_CALL_LIMIT
        sync: false
      - key: PROJECT_BUDGET_PRIOR_SPEND_THB
        sync: false
      # Optional access code for the AI features
      - key: DEMO_ACCESS_CODE
        sync: false
      # Optional shared demo accounts (test-01, test-02, admin; password 1234). Off unless "true".
      - key: DEMO_ACCOUNTS
        sync: false
      # Optional Sign in with Google for customers
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
